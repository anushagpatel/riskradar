change_kind = "abs"
demo_start = 1.1
demo_vol = 0.05
rules = [
  { type = "percentile", name = "Percentile of history since 1987", elevated = 80, high = 95, min_obs = 40 },
  { type = "change", name = "Change over 4 quarters (pp)", lookback = 4, elevated = 0.5, high = 1.0 },
]

# ---------------------------------------------------------------- OFR hedge fund monitor
# The mnemonic is resolved at runtime from the OFR metadata search (see riskradar/ofr.py)
# unless OFR_LEVERAGE_MNEMONIC is set in .env. The resolved mnemonic and series name are
# shown on the Methodology tab so you can audit the choice.

[indicators.hf_leverage]
label = "Hedge fund leverage (OFR / SEC Form PF)"
category = "Hedge fund leverage"
source = "ofr"
unit = "ratio"
periods_per_year = 4
change_kind = "pct"
demo_start = 8.0
demo_vol = 0.03
rules = [
  { type = "pct_change", name = "Change over 4 quarters (%)", lookback = 4, elevated = 10, high = 20 },
]

[ofr]
search_query = "*leverage*"
name_must_contain = ["leverage"]
mnemonic_prefix = "FPF-ALLQHF"

