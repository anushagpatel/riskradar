# RiskRadar AI - indicator definitions and heuristic thresholds.
#
# IMPORTANT: every threshold below is an illustrative, user-editable heuristic.
# None of them is a validated financial risk rating, a forecast, or investment advice.
# Edit freely; the dashboard, alerts and AI context all read from this file.
#
# Rule types (all evaluated on the stored series):
#   level       latest value
#   change      absolute change over `lookback` observations (same units as the series)
#   pct_change  percent change over `lookback` observations
#   yoy         year-over-year percent growth (uses `periods_per_year`)
#   drawdown    % decline from the trailing-`window_obs` peak (thresholds are negative)
#   percentile  percentile rank of the latest value within the stored history
# A rule has `elevated` and `high` thresholds. Direction is "above" (value >= threshold)
# unless `direction = "below"` (value <= threshold), which `drawdown` uses implicitly.

[meta]
disclaimer = "Classifications are heuristic research signals derived from configurable thresholds. They are not validated financial risk ratings, forecasts, or investment advice."

[defaults]
history_start = "2000-01-01"

# ---------------------------------------------------------------- FRED indicators

[indicators.vix]
label = "CBOE Volatility Index (VIX)"
category = "Market volatility"
source = "fred"
series_id = "VIXCLS"
unit = "index pts"
periods_per_year = 252
change_kind = "pct"
demo_start = 17.0
demo_vol = 0.06
rules = [
  { type = "level", name = "VIX level", elevated = 20, high = 30 },
  { type = "percentile", name = "VIX percentile of history", elevated = 80, high = 95, min_obs = 500 },
]

[indicators.sp500_drawdown]
label = "S&P 500 index"
category = "Equity market drawdown"
source = "fred"
series_id = "SP500"
unit = "index"
periods_per_year = 252
change_kind = "pct"
demo_start = 5200.0
demo_vol = 0.01
rules = [
  { type = "drawdown", name = "Drawdown from trailing 1-year peak (%)", window_obs = 252, elevated = -10, high = -20 },
]

[indicators.hy_oas]
label = "ICE BofA US High Yield OAS"
category = "Corporate credit spreads"
source = "fred"
series_id = "BAMLH0A0HYM2"
unit = "%"
periods_per_year = 252
change_kind = "abs"
demo_start = 3.2
demo_vol = 0.02
rules = [
  { type = "level", name = "HY spread level (%)", elevated = 5.0, high = 7.0 },
  { type = "change", name = "HY spread widening over 20 obs (pp)", lookback = 20, elevated = 0.75, high = 1.5 },
]

[indicators.fed_funds]
label = "Effective federal funds rate"
category = "Interest rates"
source = "fred"
series_id = "FEDFUNDS"
unit = "%"
periods_per_year = 12
change_kind = "abs"
demo_start = 4.0
demo_vol = 0.03
rules = [
  { type = "change", name = "12-month change in policy rate (pp)", lookback = 12, elevated = 1.0, high = 2.0 },
]

[indicators.ust_10y]
label = "10-year Treasury yield"
category = "Interest rates"
source = "fred"
series_id = "DGS10"
unit = "%"
periods_per_year = 252
change_kind = "abs"
demo_start = 4.2
demo_vol = 0.01
rules = [
  { type = "change", name = "Rise over 60 obs (pp)", lookback = 60, elevated = 0.5, high = 1.0 },
]

[indicators.ust_2y]
label = "2-year Treasury yield"
category = "Interest rates"
source = "fred"
series_id = "DGS2"
unit = "%"
periods_per_year = 252
